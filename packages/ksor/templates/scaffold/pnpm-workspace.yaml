packages:
  - system/site
  - system/gateways/*
  - system/packages/*

# 48-hour quarantine on newly published dependency versions — a routine
# `pnpm install` here never picks up a day-zero compromised release.
minimumReleaseAge: 2880

# Dependency install scripts are denied by default. Add a package here only
# with a comment naming what breaks without it.
onlyBuiltDependencies: []
