name: Validate knowledge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, for the `ksor build` step you add when this job
          # grows an install: build verifies the takedown ledger never shrank
          # against every version git has seen, and REFUSES on a shallow clone
          # (ksor-ledger-unverifiable). The checker below needs no history —
          # it reads build.lock.json's id set instead — so this line is here
          # so that adding build later does not turn CI red on arrival.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # The checker is self-contained Node (generated by ksor) — no install step needed.
      - run: node .agents/skills/format-checker/check.mjs
