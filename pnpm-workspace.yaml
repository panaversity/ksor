# Workspace layout and shared version pins. The catalog is the one place agents
# look for shared dependency versions (see AGENTS.md).
packages:
  - packages/*

catalog:
  # TypeScript 7 = the native (Go) compiler. It has no stable programmatic API
  # until 7.1, so nothing in this repo may import the "typescript" package —
  # guard-invariants rule 6 enforces that.
  typescript: 7.0.2
  vitest: ^4.1.10
  # zod: EXACT pin, for the same reason `yaml` is one. The record module is
  # copied byte-for-byte into the scaffold's site (decision 18), the site pins
  # its own dependencies exactly, and the two halves of ONE rule set validating
  # the same frontmatter under two different zod versions is precisely the
  # state that decision exists to prevent. Under `^4.4.3` the first 4.5.0 split
  # them with nothing red; record-module-drift now asserts catalog, site
  # manifest and scaffold lock are the same string.
  zod: 4.4.3
  "@standard-schema/spec": ^1.1.0
  "@types/node": ^24.13.3
  # yaml (ISC, zero deps): the record is real YAML — the profile's `ksor:` block
  # and the governance/ledger files cannot be read by the line scanners
  # (research/okf-native.md §2 item 8; decision 26). EXACT pin: 2.9.0, published
  # 2026-05-11, so the 48h quarantine below can never hold the install.
  yaml: 2.9.0

# Supply-chain hygiene (research/base-environment.md §2):
# 48-hour quarantine on newly published dependency versions. npm supply-chain
# attacks are usually detected within hours of publish; the cooldown means a
# routine `pnpm install` here never picks up a day-zero compromised release.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@panaversity/*"

# Dependency install scripts are denied by default; decisions are recorded
# here with a why-comment. (found live 2026-08-18: pnpm 11 ignores the v10
# onlyBuiltDependencies key and hard-fails on undecided build scripts.)
# These arrived with the kernel conversion (decision 11), verified safe to deny
# 2026-08-19. It read "all three" until 2026-08-27: decision 12's 2026-08-22
# revision dropped `@google/genai`, and `protobufjs` — which was only ever its
# transitive dep — went uninstalled with it, so that denial now describes
# nothing. Left in place because a denial costs nothing and the package returns
# if the SDK ever does; the COUNT is what was wrong.
allowBuilds: { esbuild: false, protobufjs: false }
