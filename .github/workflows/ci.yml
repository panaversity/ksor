name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more must say so.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job bundles every mechanical check (eve pattern): cheap, and an agent
  # gets all lint-class feedback from a single red job.
  lint:
    name: Lint, format, guards, corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint:ci
      - run: pnpm fmt:ci
      - run: pnpm guard
      - run: pnpm check:corpus

  changesets:
    name: Changeset present
    # Version PRs CONSUME changesets — that is their whole job — so the gate
    # exempts them (found live: the 0.0.2 version PR failed its own release
    # mechanism's check, 2026-08-18). changeset-release/* is the changesets
    # action's branch; release-* is the manual rescue's.
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      !startsWith(github.head_ref, 'release-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Fails when the PUBLISHED package changed without a changeset —
      # bundled docs included, they ship in the tarball (AGENTS.md policy:
      # patch by default pre-1.0; repo docs/tooling outside packages/ are
      # exempt).
      - run: pnpm changeset status --since=origin/main
      # ...and the same for the BUNDLED KERNEL, which changesets cannot see.
      # The kernel packages are `private: true`, so changesets ignores them —
      # but decision 12 inlines them INTO the published tarball, so editing
      # them changes what adopters install. Without this, a kernel change
      # shipped inside someone else's release with no changelog line (verified
      # 2026-08-20: `changeset status` reports nothing for a content-only
      # diff). The changeset belongs to @panaversity/ksor, the thing actually
      # published — not to the private package.
      - name: Bundled-kernel changes need a changeset too
        run: |
          kernel=$(git diff --name-only origin/main...HEAD -- packages/ \
            | grep -v '^packages/ksor/' | head -1)
          noted=$(git diff --name-only origin/main...HEAD -- .changeset/ \
            | grep -E '\.md$' | grep -v 'README' | head -1)
          if [ -n "$kernel" ] && [ -z "$noted" ]; then
            echo "::error::$kernel changed, but no changeset was added."
            echo "The kernel is bundled into @panaversity/ksor, so this changes"
            echo "what adopters install. Run \`pnpm changeset\` and describe it"
            echo "for release-notes readers (patch by default pre-1.0)."
            exit 1
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Workspace packages resolve one another's types through their built
      # dist (package.json exports), so build first (found live: the first
      # multi-package push, 2026-08-19).
      - run: pnpm build
      - run: pnpm typecheck

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Unit tests import across workspace packages — same dist resolution.
      - run: pnpm build
      - run: pnpm test:unit

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Integration tests exercise the built artifact, so build first.
      - run: pnpm build
      - run: pnpm test:integration

  build:
    name: Build + publint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm publint

  scaffold-e2e:
    name: Scaffold walkthrough (browser)
    runs-on: ubuntu-latest
    # ~8-11 min normally (playwright install + 3 browser suites) — measured
    # 8.3 and 10.2 min on main and 8.5 on a branch, 2026-08-27. The comment
    # here said "~5 min" and had been wrong for a while; the cap is the thing
    # it justifies, so a stale number quietly makes 25 look like 5x headroom
    # when it is closer to 2.5x. Still a generous cap, and generous is the
    # point: a hung dev-server or browser launch FAILS fast (red, actionable)
    # instead of running to GitHub's 6-hour default and reading as "stuck".
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # playwright is a devDependency of packages/ksor, so its binary is not
      # visible to `pnpm exec` at the workspace root (found live: first CI run,
      # ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL, 2026-08-18).
      - run: pnpm --dir packages/ksor exec playwright install chromium --with-deps
      - run: KSOR_E2E=1 pnpm exec vitest run --config vitest.integration.config.ts packages/ksor/src/scaffold-e2e.integration.test.ts
      # The surface contract (clauses 1-4), asserted against the emitted
      # Fumadocs shell. It ran against two implementations until decision 9's
      # 2026-08-24 revision retired `workbench/shells/docusaurus/`; the suite
      # keeps its `.each(SHELLS)` shape so adding one back needs no
      # restructuring, but it proves the seam against ONE shell today.
      - run: KSOR_E2E=1 pnpm exec vitest run --config vitest.integration.config.ts packages/ksor/src/shell-conformance.integration.test.ts
      # The visibility canary sweep (specs/ksor/visibility): a restricted
      # document leaves no trace below its tier, with positive controls so
      # "filtered" can never be confused with "broken".
      - run: KSOR_E2E=1 pnpm exec vitest run --config vitest.integration.config.ts packages/ksor/src/visibility-conformance.integration.test.ts

  kernel-db:
    name: Kernel acceptance (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ksor
          POSTGRES_PASSWORD: ksor
          POSTGRES_DB: ksor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ksor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The kernel's database tier (decision 11): ingest → retrieve round
      # trips against real Postgres + pgvector. The live provider suites — one
      # real embedding call each, proving the seam and catching vendor API
      # drift — gate separately on their own keys and announce themselves as
      # skipped without one. GEMINI_API_KEY is configured. OPENAI_API_KEY is
      # passed so the OpenAI tripwire arms the moment that secret is added;
      # until then its suite reports "skipped — set OPENAI_API_KEY" rather
      # than vanishing from the run, which is how it went a week unarmed while
      # its own header called it the proof the seam is vendor-neutral.
      - run: pnpm test:db
        env:
          KSOR_DB_URL: postgresql://ksor:ksor@localhost:5432/ksor
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  init-windows:
    name: Init acceptance (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec vitest run --config vitest.integration.config.ts packages/ksor/src/init.integration.test.ts
      # The DRIFT tests too: they compare files across the tree, and the first
      # thing Windows found was one of them failing on line endings rather than
      # on drift (.gitattributes pins the templates to LF; the kernel's copies
      # take the platform default). They moved from the unit tier to this one
      # — AGENTS.md assigns repo-tree scans here — so Windows has to run them
      # or it stops running the checks it is best placed to catch.
      #
      # `drift.integration.test.ts` is a SUBSTRING filter over every one of
      # them, not a list. The list silently rotted: it named a file the tree no
      # longer had (vitest drops a filter that matches nothing as long as
      # another filter matches something, so four files named ran three, green
      # and without a warning) and it never gained the two drift suites that
      # arrived with the profile. ci-workflow.integration.test.ts asserts that
      # this filter still covers every `*-drift.integration.test.ts` there is.
      - run: pnpm exec vitest run --config vitest.integration.config.ts drift.integration.test.ts packages/ksor/src/scaffold-scripts.integration.test.ts packages/ksor/src/discovery-document.integration.test.ts
      # The stage lock rests on three primitives whose Windows semantics are
      # the whole question: exclusive create (`wx`), pid liveness, and removing
      # a file another process may hold. Named here for the same reason as the
      # drift tests above — this runner is the one placed to catch them.
      - run: pnpm exec vitest run --config vitest.integration.config.ts packages/ksor/src/stage-concurrency.integration.test.ts
      - run: pnpm test:unit

  manager-acceptance:
    name: Manager acceptance (${{ matrix.manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.manager == 'bun'
      - run: pnpm build
      # The scaffold emitted for this manager, walked the way its adopter
      # would: install (local tarball swapped for the stamped version — the
      # only divergence), resolve the pinned `ksor` bin, run the checker,
      # build the static site (issue #28).
      - run: node scripts/manager-acceptance.mjs ${{ matrix.manager }}

  container:
    name: Container acceptance (no vendor)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ksor
          POSTGRES_PASSWORD: ksor
          POSTGRES_DB: ksor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ksor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # `ksor init` ships a Dockerfile, and the claim on it is that a served
      # record runs anywhere. A claim only checked by deploying to one vendor is
      # a claim about that vendor — so this walks the emitted artifact on plain
      # Docker: scaffold, publish a generation, build the image, boot it, and
      # ask it a question over MCP. It installs the LOCAL build, and asserts the
      # Dockerfile it builds differs from the emitted one by exactly the line
      # that brings that tarball in.
      - run: node scripts/container-acceptance.mjs
        env:
          KSOR_DB_URL: postgresql://ksor:ksor@localhost:5432/ksor
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
