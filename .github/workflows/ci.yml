name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more must say so.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job bundles every mechanical check (eve pattern): cheap, and an agent
  # gets all lint-class feedback from a single red job.
  lint:
    name: Lint, format, guards, corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint:ci
      - run: pnpm fmt:ci
      - run: pnpm guard
      - run: pnpm check:corpus

  changesets:
    name: Changeset present
    # Version PRs CONSUME changesets — that is their whole job — so the gate
    # exempts them (found live: the 0.0.2 version PR failed its own release
    # mechanism's check, 2026-08-18). changeset-release/* is the changesets
    # action's branch; release-* is the manual rescue's.
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      !startsWith(github.head_ref, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Fails when anything under packages/ksor changed without a changeset —
      # bundled docs included, they ship in the tarball (AGENTS.md policy:
      # patch by default pre-1.0; repo docs/tooling outside the package are
      # exempt because the gate only watches the published package).
      - run: pnpm changeset status --since=origin/main

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Integration tests exercise the built artifact, so build first.
      - run: pnpm build
      - run: pnpm test:integration

  build:
    name: Build + publint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm publint

  scaffold-e2e:
    name: Scaffold walkthrough (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # playwright is a devDependency of packages/ksor, so its binary is not
      # visible to `pnpm exec` at the workspace root (found live: first CI run,
      # ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL, 2026-08-18).
      - run: pnpm --dir packages/ksor exec playwright install chromium --with-deps
      - run: KSOR_E2E=1 pnpm exec vitest run --config vitest.integration.config.ts packages/ksor/src/scaffold-e2e.integration.test.ts
      # The shell swap seam, proven with two implementations: the Fumadocs
      # reference as emitted, and the workbench Docusaurus shell via its swap
      # recipe — one suite, identical assertions (surface contract clauses 1-4).
      - run: KSOR_E2E=1 pnpm exec vitest run --config vitest.integration.config.ts packages/ksor/src/shell-conformance.integration.test.ts
      # The visibility canary sweep (specs/ksor/visibility): a restricted
      # document leaves no trace below its tier, with positive controls so
      # "filtered" can never be confused with "broken".
      - run: KSOR_E2E=1 pnpm exec vitest run --config vitest.integration.config.ts packages/ksor/src/visibility-conformance.integration.test.ts

  kernel-db:
    name: Kernel acceptance (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ksor
          POSTGRES_PASSWORD: ksor
          POSTGRES_DB: ksor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ksor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The kernel's database tier (decision 11): ingest → retrieve round
      # trips against real Postgres + pgvector. The Gemini-live suites gate
      # separately on GEMINI_API_KEY and skip while the secret is pending
      # (docs/status.md → Pending owner actions).
      - run: pnpm test:db
        env:
          KSOR_DB_URL: postgresql://ksor:ksor@localhost:5432/ksor
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  init-windows:
    name: Init acceptance (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec vitest run --config vitest.integration.config.ts packages/ksor/src/init.integration.test.ts
      - run: pnpm test:unit
