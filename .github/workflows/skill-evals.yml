name: Skill evals

# The agent tier (AGENTS.md → Testing): a shipped skill run by a real coding
# agent, with the skill and without it. It spends model tokens, so it runs on
# push to main and by hand — never per pull request — and only when the paths
# it measures changed. Without ANTHROPIC_API_KEY it still runs and prints that
# every suite was skipped, so an unarmed tier is visible rather than absent.
on:
  push:
    branches: [main]
    paths:
      - "packages/ksor/templates/scaffold/.agents/skills/**"
      - "packages/ksor/templates/scaffold/AGENTS.md"
      - "packages/ksor/src/evals/**"
      - "vitest.agent.config.ts"
      - ".github/workflows/skill-evals.yml"
  workflow_dispatch:

concurrency:
  group: skill-evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  skill-evals:
    name: Skill evals (agent)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The agent follows the skill, and the skill names `pdftotext` for a PDF.
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      # The runner, pinned. A global install, not a repo dependency: nothing an
      # adopter installs depends on it (guard rule 5 asks nothing of it).
      - run: npm install -g @anthropic-ai/claude-code@2.1.258
      - run: pnpm build
      - run: pnpm test:agent
        env:
          CI: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
