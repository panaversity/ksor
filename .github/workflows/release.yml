name: Release

on:
  push:
    branches: [main]

# Never cancel a release mid-publish; queue instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # changesets/action pushes the version PR branch
  pull-requests: write # ...and opens/updates the version PR
  id-token: write # npm trusted publishing + provenance attestation

jobs:
  release:
    name: Version or publish
    if: github.repository == 'panaversity/ksor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changesets action pushes the version PR via the GitHub API, so
          # the git credential never needs to persist into .git/config.
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The version PR is opened by the repo GITHUB_TOKEN, which never triggers
      # the pull_request CI workflow — so the full gate runs HERE, in the same
      # job that publishes. No artifact ships untested.
      #
      # BUILD FIRST. Workspace packages resolve one another's types through
      # their built dist (package.json exports), so typecheck, the unit tier
      # and the integration tier all need it — ci.yml learned this on
      # 2026-08-19 and this workflow did not, because a single-package repo
      # had no cross-package types to resolve. The kernel conversion gave it
      # some, and the FIRST release after it failed here with "Cannot find
      # module '@panaversity/ksor-postgres'" (found live, 2026-08-20).
      - run: pnpm build
      - run: pnpm lint:ci && pnpm fmt:ci && pnpm typecheck && pnpm guard && pnpm check:corpus
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm publint
      # Publishing uses npm trusted publishing (id-token above): configure the
      # GitHub Actions trusted publisher in the npm package settings for
      # @panaversity/ksor — no NPM_TOKEN is stored in this repository.
      - uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          # v2 renamed these inputs from publish/version to *-script.
          publish-script: pnpm changeset publish
          # `pnpm run version` is `changeset version` PLUS the sync that points
          # docs/status.md at what is about to publish. They are one act: the
          # docs-truth assertion holds the two equal, and a bump that left the
          # document behind blocked the release (found live, 0.0.54).
          version-script: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
